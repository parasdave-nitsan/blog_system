<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:blog="http://typo3.org/ns/Nitsan/BlogSystem/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Report" />

<f:section name="main">

    <section class="blog-detail-section">
        <div class="container">
            <f:link.action action="index" controller="Report" arguments="{blog: blog}"
                class="btn btn-sm btn-outline-secondary">
                <span aria-hidden="true">←</span>
                Back to Blog List
            </f:link.action>

            <article class="blog-detail">
                <header class="blog-detail-header">
                    <span class="blog-list-eyebrow">From Our Journal</span>
                    <h1 class="blog-detail-title">{blog.title}</h1>

                    <div class="blog-detail-meta">
                        <div class="blog-author">
                            <span class="author-avatar">
                                {blog.author -> f:format.crop(maxCharacters: 1)}
                            </span>
                            <div class="author-info">
                                <span class="meta-label">Written by</span>
                                <span class="author-name">{blog.author}</span>
                            </div>
                        </div>

                        <blog:dateFormat date="{blog.publishDate}" format="d.m.Y H:i" />

                        <f:if condition="{category}">
                            <span class="blog-category">Category: {category.name}</span>
                        </f:if>



                        <span class="blog-views">
                            <span class="views-icon">◉</span>
                            <span>{blog.views}</span>
                            <span class="views-label">views</span>
                        </span>
                    </div>
                </header>

                <f:if condition="{blog.thumbnail}">
                    <f:image image="{blog.thumbnail}" class="blog-detail-thumbnail" alt="{blog.title}" width="1400c"
                        height="700c" />
                </f:if>

                <div class="blog-detail-content">
                    {blog.description -> f:format.raw()}
                </div>

            </article>
        </div>
    </section>

</f:section>
